name: Deploy Blazor WASM to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish Blazor WASM
        run: dotnet publish Src/Portfolio.Frontend/Portfolio.Frontend/Portfolio.Frontend.csproj -c Release -o publish

      - name: Ensure project base href
        run: |
          INDEX_PATH="publish/wwwroot/index.html"
          echo "Found index.html at: $INDEX_PATH"
          if [ ! -f "$INDEX_PATH" ]; then
            echo "index.html not found; failing"
            exit 1
          fi
          perl -0777 -pe 's#<base\s+href=.*?>#<base href="/MauroLeonardoPortfolio/" />#is' -i "$INDEX_PATH"
          echo "New base tag:" ; grep -i '<base' "$INDEX_PATH" || true

      - name: Add .nojekyll file
        run: touch publish/wwwroot/.nojekyll

      - name: Upload static site for GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4